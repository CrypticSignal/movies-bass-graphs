name: Analyze graph levels
on:
  workflow_dispatch:
  push:
    branches: [feat/frequency-ranking, feat/half-hz, fix/axis-consensus]
    paths:
      - scripts/analyze-graphs.py
concurrency:
  group: graph-analysis-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install Pillow numpy
      - run: python scripts/analyze-graphs.py
      - name: Save estimated levels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/graphs/levels.json /tmp/graph-levels.json
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp /tmp/graph-levels.json public/graphs/levels.json
          git add public/graphs/levels.json
          if ! git diff --cached --quiet; then
            git commit -m 'Digitize frequency levels from graph images'
            git push origin HEAD:"$GITHUB_REF_NAME"
            if [ "$GITHUB_REF_NAME" = main ]; then gh workflow run deploy.yml --ref main; fi
          fi
