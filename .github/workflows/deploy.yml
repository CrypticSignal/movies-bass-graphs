name: Build and deploy gallery
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/workflows/recover-graphs.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run build
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish built files to the allowed Pages branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gallery-pages origin/gh-pages
          rsync -a --delete --exclude=.git --exclude=.github dist/ /tmp/gallery-pages/
          touch /tmp/gallery-pages/.nojekyll
          git -C /tmp/gallery-pages config user.name "github-actions[bot]"
          git -C /tmp/gallery-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gallery-pages add .
          if ! git -C /tmp/gallery-pages diff --cached --quiet; then
            git -C /tmp/gallery-pages commit -m "Deploy gallery from $GITHUB_SHA"
            git -C /tmp/gallery-pages push origin HEAD:gh-pages
          fi
          gh workflow run publish.yml --ref gh-pages
