name: Recover graph images
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-graphs.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Recover catalogue and images
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, pathlib, urllib.request
          from PIL import Image
          root = pathlib.Path("public/graphs")
          root.mkdir(parents=True, exist_ok=True)
          url = "https://opensheet.elk.sh/1SdwJ_mfYgghxZG8gy41ke22e2AM9gUPTB1EmZgYcHoY/Sheet1"
          with urllib.request.urlopen(url, timeout=60) as response:
              rows = json.load(response)
          if not isinstance(rows, list) or not rows:
              raise RuntimeError("Catalogue is empty or invalid")
          print("Catalogue entries:", len(rows), flush=True)
          def recover(row):
              row = dict(row)
              source = row.get("imgurURL", "")
              try:
                  if not source.startswith("https://i.imgur.com/"):
                      raise ValueError("Not a direct HTTPS Imgur image")
                  request = urllib.request.Request(source, headers={"User-Agent": "MoviesBassGraphs/1.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(15 * 1024 * 1024 + 1)
                  if len(data) > 15 * 1024 * 1024:
                      raise ValueError("Image exceeds 15 MB")
                  with Image.open(io.BytesIO(data)) as image:
                      image.verify()
                  with Image.open(io.BytesIO(data)) as image:
                      width, height = image.size
                      if width < 500 or height < 200:
                          raise ValueError(f"Suspected placeholder: {width}x{height}")
                      image = image.convert("RGB")
                      name = hashlib.sha256(source.encode()).hexdigest()[:20] + ".jpg"
                      image.save(root / name, quality=95)
                  row["imagePath"] = "graphs/" + name
                  print(json.dumps({"movie": row.get("movieName"), "source": source, "size": [width, height], "path": row["imagePath"]}), flush=True)
              except Exception as error:
                  row["imagePath"] = None
                  print(json.dumps({"movie": row.get("movieName"), "source": source, "error": str(error)}), flush=True)
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              recovered = list(pool.map(recover, rows))
          (root / "catalogue.json").write_text(json.dumps(recovered, indent=2) + "\n")
          count = sum(bool(row.get("imagePath")) for row in recovered)
          print(f"Recovered {count}/{len(rows)} images", flush=True)
          if not count:
              raise RuntimeError("No valid graph images recovered")
          PY
      - name: Save recovered images for review
        run: |
          git switch -c fix/recovered-graph-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/graphs
          git commit -m "Recover movie graph images from Imgur"
          git push origin HEAD:refs/heads/fix/recovered-graph-images
