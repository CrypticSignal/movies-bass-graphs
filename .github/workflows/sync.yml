name: Sync AVS film graphs
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-avs.py
      - scripts/avs_source.py
      - scripts/analyze-graphs.py
      - scripts/graph_files.py
      - scripts/legacy-graph-names.json
      - .github/workflows/sync.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: film-graph-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install Pillow numpy beautifulsoup4 websocket-client
      - run: python scripts/sync-avs.py
      - run: python scripts/analyze-graphs.py
      - name: Save changes and publish only when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/graphs
          if git diff --cached --quiet; then
            echo 'No catalogue or graph changes; nothing to publish.'
            exit 0
          fi
          git commit -m 'Sync latest AVS first-post film graphs'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
