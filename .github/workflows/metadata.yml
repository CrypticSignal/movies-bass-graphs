name: Extract soundtrack metadata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install Pillow
      - run: python scripts/extract-metadata.py
        env:
          OMP_THREAD_LIMIT: '1'
      - name: Save metadata on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/graphs/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Extract soundtrack labels from recovered graph headers'
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
