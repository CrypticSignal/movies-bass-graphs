name: Check AVS source access
on:
  push:
    branches: [main]
    paths: [.github/workflows/avs-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install beautifulsoup4 websocket-client
      - name: Read first-post film list in browser
        run: |
          xvfb-run -a google-chrome --no-sandbox --no-first-run --no-default-browser-check --disable-extensions --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir=/tmp/avs-browser about:blank >/tmp/chrome.log 2>&1 &
          python - <<'PY'
          import urllib.request, json, time
          import websocket
          from bs4 import BeautifulSoup
          local = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          pages = None
          for attempt in range(45):
              try:
                  pages = json.load(local.open('http://127.0.0.1:9222/json', timeout=2))
                  break
              except OSError:
                  time.sleep(1)
          if pages is None:
              from pathlib import Path
              print(Path('/tmp/chrome.log').read_text()[-3000:])
              raise RuntimeError('Browser did not expose local debugging endpoint')
          page = next(p for p in pages if p['type'] == 'page')
          ws = websocket.create_connection(page['webSocketDebuggerUrl'], suppress_origin=True, timeout=10)
          number = 0
          def command(method, params):
              global number
              number += 1
              ws.send(json.dumps({'id': number, 'method': method, 'params': params}))
              while True:
                  reply = json.loads(ws.recv())
                  if reply.get('id') == number:
                      return reply.get('result', {})
          url = 'https://www.avsforum.com/threads/the-ultimate-list-of-bass-in-movies-w-frequency-charts-bass-charts-are-on-the-first-page.2763785/'
          command('Page.navigate', {'url': url})
          for attempt in range(30):
              time.sleep(2)
              reply = command('Runtime.evaluate', {'expression': 'document.documentElement.outerHTML', 'returnByValue': True})
              html = reply.get('result', {}).get('value', '')
              if 'List of Films' in html:
                  break
          soup = BeautifulSoup(html, 'html.parser')
          posts = soup.select('article.message--post, article[data-content^="post-"]')
          print('Page title:', soup.title.get_text() if soup.title else '')
          print('Posts:', len(posts), 'response size:', len(html))
          if not posts:
              print('Response start:', html[:2000])
              raise RuntimeError('First post not found')
          body = posts[0].select_one('.message-body .bbWrapper, .message-body')
          if not body:
              raise RuntimeError('First post body not found')
          text = body.get_text('\n', strip=True)
          position = text.lower().find('list of films')
          print('List heading position:', position)
          print('First-post start:', str(body)[:1800])
          links = [a for a in body.find_all('a', href=True) if 'imgur.com' in a['href']]
          print('Imgur links:', len(links))
          print('First links:', [(a.get_text(' ', strip=True), a['href']) for a in links[:5]])
          print('Last links:', [(a.get_text(' ', strip=True), a['href']) for a in links[-5:]])
          if links:
              print('First link surrounding HTML:', str(links[0].parent)[:2200])
              print('Last link surrounding HTML:', str(links[-1].parent)[-1800:])
          PY
